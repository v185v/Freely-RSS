[package]
name = "freelyrss-desktop"
version = "0.0.1"
description = "FreelyRSS desktop application shell"
authors = ["FreelyRSS contributors"]
edition = "2021"

[workspace]

[lib]
name = "freelyrss_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["std"] }
freelyrss-ai-adapter = { path = "../../../crates/ai-adapter" }
freelyrss-core-domain = { path = "../../../crates/core-domain" }
getrandom = "0.2.15"
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3.20.0"
