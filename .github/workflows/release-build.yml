name: Release Build

on:
  push:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a GitHub prerelease after the build succeeds.
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build-desktop:
    name: Desktop bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact_name: freelyrss-desktop-linux
          - os: windows-latest
            artifact_name: freelyrss-desktop-windows
          - os: macos-latest
            artifact_name: freelyrss-desktop-macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install JavaScript dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Build desktop bundles
        run: corepack pnpm run desktop:tauri:build

      - name: Upload desktop bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: apps/desktop/src-tauri/target/release/bundle/**/*
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub prerelease
    runs-on: ubuntu-latest
    needs: build-desktop
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publish_release) }}

    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create or update prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          short_sha="${COMMIT_SHA::7}"
          tag="build-${short_sha}"
          title="FreelyRSS build ${short_sha}"
          notes_file="$(mktemp)"

          cat > "${notes_file}" <<NOTES
          Automated FreelyRSS desktop build.

          Commit: ${COMMIT_SHA}
          Workflow run: ${RUN_URL}

          These artifacts are unsigned prerelease builds. Platform signing,
          notarization, hosted sync deployment, and mobile store builds are not
          part of this workflow yet.
          NOTES

          if gh release view "${tag}" --repo "${REPOSITORY}" > /dev/null 2>&1; then
            gh release edit "${tag}" \
              --repo "${REPOSITORY}" \
              --title "${title}" \
              --notes-file "${notes_file}" \
              --prerelease
          else
            gh release create "${tag}" \
              --repo "${REPOSITORY}" \
              --target "${COMMIT_SHA}" \
              --title "${title}" \
              --notes-file "${notes_file}" \
              --prerelease
          fi

          mapfile -d '' files < <(
            find release-assets -type f \
              \( -name '*.AppImage' \
                -o -name '*.deb' \
                -o -name '*.rpm' \
                -o -name '*.dmg' \
                -o -name '*.msi' \
                -o -name '*.exe' \
                -o -name '*.tar.gz' \
                -o -name '*.zip' \) \
              -print0
          )

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No releasable desktop bundle files were found."
            find release-assets -type f -print
            exit 1
          fi

          gh release upload "${tag}" "${files[@]}" \
            --repo "${REPOSITORY}" \
            --clobber
